<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>거북섬 어린왕자 AR 보물찾기</title>
    
    <!-- A-Frame 및 MindAR 이미지 인식 라이브러리 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      /* 상단 안내 바 */
      .ar-ui-top {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        z-index: 1000; background: rgba(16, 43, 75, 0.85); color: #fff;
        padding: 10px 20px; border-radius: 25px; font-size: 14px;
        text-align: center; border: 1px solid #e8ad37; backdrop-filter: blur(4px);
      }

      /* 미션 완료 알림 모달 */
      .mission-modal {
        display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        z-index: 1000; width: 85%; max-width: 380px; background: #fffaf0;
        border: 2px solid #e8ad37; border-radius: 20px; padding: 20px;
        text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      }
      .mission-modal h2 { margin: 0 0 8px; color: #102b4b; font-size: 20px; }
      .mission-modal p { margin: 0 0 16px; color: #555; font-size: 13px; line-height: 1.5; }
      .mission-modal button {
        background: linear-gradient(135deg, #173a61, #285b7d); color: #fff;
        border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold;
        font-size: 14px; cursor: pointer; width: 100%;
      }
    </style>
  </head>
  <body>

    <div class="ar-ui-top" id="uiStatus">
      ✦ 현장의 어린왕자 마커 이미지를 비춰주세요 ✦
    </div>

    <!-- 미션 완료 팝업 UI -->
    <div class="mission-modal" id="missionModal">
      <h2>🎉 미션 완료!</h2>
      <p>어린왕자의 인사를 받았습니다.<br>보물 스탬프가 지급되었습니다!</p>
      <button id="btnComplete">스탬프 보관함 확인하기</button>
    </div>

    <!-- AR 씬 설정: targets.mind 파일의 이미지를 추적 -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes;" 
      color-space="sRGB" 
      embedded 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 재생할 어린왕자 인사 영상 -->
        <video id="princeVideo" src="prince-hello.mp4" preload="auto" loop playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 0번 타깃(ZONE 01 이미지) 인식 시 비디오 평면 표시 -->
      <a-entity id="targetMarker" mindar-image-target="targetIndex: 0">
        <!-- 마커 이미지 위에 띄울 16:9 영상 평면 -->
        <a-video 
          src="#princeVideo" 
          position="0 0 0" 
          height="1" 
          width="1" 
          rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const marker = document.querySelector('#targetMarker');
      const video = document.querySelector('#princeVideo');
      const uiStatus = document.querySelector('#uiStatus');
      const missionModal = document.querySelector('#missionModal');
      const btnComplete = document.querySelector('#btnComplete');

      let isMissionFinished = false;

      // 마커 이미지가 카메라에 감지되었을 때
      marker.addEventListener('targetFound', () => {
        uiStatus.textContent = '🌟 마커 인식 성공! 어린왕자가 인사합니다.';
        video.muted = false; // 소리 활성화
        video.play();

        // 3초 후 미션 완료 팝업 표시 및 스탬프 적립
        if (!isMissionFinished) {
          setTimeout(() => {
            isMissionFinished = true;
            missionModal.style.display = 'block';

            // 스탬프 저장 처리
            let collected = JSON.parse(localStorage.getItem('geobukseom-stamps') || '[]');
            if (!collected.includes(1)) {
              collected.push(1);
              localStorage.setItem('geobukseom-stamps', JSON.stringify(collected));
            }
          }, 3000);
        }
      });

      // 마커가 시야에서 벗어났을 때
      marker.addEventListener('targetLost', () => {
        uiStatus.textContent = '✦ 마커 이미지를 카메라에 맞춰주세요 ✦';
        video.pause();
      });

      // 완료 버튼 터치 시 스탬프/인증서 화면 등으로 이동
      btnComplete.addEventListener('click', () => {
        alert('보물 스탬프가 성공적으로 기록되었습니다!');
      });
    </script>
  </body>
</html>
